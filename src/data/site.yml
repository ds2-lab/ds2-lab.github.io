welcome:
  heading: Welcome to the AXIS Research Lab
  intro: >-
    We are a research team of [Data Science](https://datascience.virginia.edu/) and
    [Computer Science](https://engineering.virginia.edu/departments/computer-science)
    at the [University of Virginia](https://www.virginia.edu/).
    We research **AI × Infrastructure & Systems** (AXIS). Our aim is
    to explore and build better systems software to sustain the
    requirements of next-generation data-intensive applications.
  body: >-
    We are interested in addressing challenges in real-world AI
    systems. Our research rethinks the abstractions underlying AI
    storage, compute, and resource allocation, guided by deep workload
    characterization . Our goal is to make AI infrastructure scalable, 
    sustainable, and accessible to everyone who builds and uses AI.
  focus_intro: "Our current efforts are focused on:"
  focus:
    - title: Rethinking Storage Systems Abstractions for AI
      text: rethinking storage system designs to sustain the exponential AI data explosion.
    - title: Rethinking AI Compute and Resource Allocation
      text: enabling elastic and affordable GPU resources for both training and inference.
    - title: Advancing Serverless Computing Foundation
      text: >-
        improving serverless computing using an end-to-end approach that cuts across the
        entire system stack, spanning applications, middleware, platforms, and OS.
        
  join: >-
    **We are committed to training the next generation of AI and data systems 
    researchers and developers.** 
    Our lab has openings at all levels — PhD/MS/BS students, research
    interns, and visiting students, with flexible start dates, to work on
    exciting research on AI systems. Feel free to reach out via email.
    Check our recent [publications](/#publications) for details.

# Shown at the top of the Research page.
mission:
  - >-
    The main research approach that we have taken is to gain deep understanding of domain
    applications' needs and to rethink systems' core abstractions based on that
    understanding; we iterate between these two activities. We have been motivated by real
    problems experienced by domain users, developers, and operators in practice. With these
    first-hand experiences, we perform comprehensive measurements to pinpoint system
    bottlenecks, characterize application behaviors and their needs, and understand
    practitioners' pain points.
  - >-
    A systems solution often requires designing a new abstraction or adapting an existing
    abstraction in a novel way (e.g., in a new scenario, under new settings or assumptions).
    We take different routes when designing new systems solutions. On the one hand is *the
    freedom of doing blue sky research*, where we openly question the fundamentals underlying
    distributed systems in face of rapidly-emerging needs and challenges. For example, we
    rethink the design of modern cloud storage systems and build [the first tensor-centric AI
    storage system that exploits tensor-level relationships to reduce storage cost and achieve
    sustainability](https://arxiv.org/abs/2604.17104). On the other hand, *we seek practical
    and easily-deployable solutions for otherwise sophisticated systems problems*. Distributed
    systems often involve complex cross-component interactions in order to support
    cross-cutting tasks such as scheduling. This leads us to gravitate towards simple and
    general solutions that solve not a specific problem, but which satisfy a general set of
    applications. For instance, we design [a new function orchestrator](/pdfs/asplos25-cidre.pdf)
    which reduces production FaaS cold start cost and is deployed in production cloud platforms.

