- date: 2023-04
  items:
    - "Congrats to Ben, Runzhou, and Jingyuan on the acceptance of [λFS](https://ds2-lab.github.io/pdfs/asplos23-lambdafs-ae.pdf) to [ASPLOS'23](https://www.asplos-conference.org/asplos2023/)! The acceptance of λFS at ASPLOS'23 marks yet another significant milestone of our serverless storage project series. Don't forget to check out our projects: **Episode I** - [InfiniCache](https://ds2-lab.github.io/pdfs/fast20-infinicache.pdf), **Episode II** - [InfiniStore](https://ds2-lab.github.io/pdfs/vldb23-infinistore.pdf), and our latest work, **Episode III** - [λFS](https://arxiv.org/abs/2306.11877)."

