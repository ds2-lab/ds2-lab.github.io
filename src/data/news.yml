# Lab news, newest first. Each entry is one month; `items` are Markdown.
# The homepage shows the most recent entries; /news shows all of them.

- date: 2026-11
  items:
    - "🚀 We’ve launched [LooseLeaf](https://looseleafcloud.org), a highly efficient Jupyter notebook platform offering free serverless GPUs to everyone at UVA. Learn more about the LooseLeaf design in our paper preprint on [arXiv](https://arxiv.org/abs/2610.33275)."

- date: 2026-10
  items:
    - "🏆 [TensorDex](https://github.com/ds2-lab/TensorDex) received the [SOSP 2026](https://sigops.org/s/conferences/sosp/2026/) **Distinguished Artifact Award**!"

- date: 2026-09
  items:
    - "🎉 Congrats to Yuqi and Ruizhe on Allpass accepted to ACM SoCC 2026!"
    - "Our survey paper on resource-efficient LLMs is published at [ACM Computing Surveys](https://dl.acm.org/doi/10.1145/3845797)!"

- date: 2026-08
  items:
    - "📢 **New Course Alert:** I'll be teaching [CS6501 AI Systems](https://tddg.github.io/cs6501-ai-sys-fall26/) in Fall 26!"

- date: 2026-07
  items:
    - "🎉 Congrats to Zirui and Zhaoyuan on [LatentStore](https://arxiv.org/abs/2605.19385) and [Zero-Prefill](https://arxiv.org/abs/2605.02960) accepted to [NSDI 2027](https://www.usenix.org/conference/nsdi27)! Stay tuned for more updates on the projects!"
    - "🎉 Congrats to Tingfeng, Zirui, Yunjia, and Zhaoyuan on [TensorDex](https://arxiv.org/abs/2604.17104) accepted to [SOSP 2026](https://sigops.org/s/conferences/sosp/2026/)! TensorDex explores fine-grained tensor-level relationships across massive AI model hubs to achieve significant lossless reduction in large-scale model storage. Stay tuned for more updates on the project!"

- date: 2026-07
  items:
    - "🎉 One paper accepted to SC'26. Congratulations to Patrick and the team!"

- date: 2026-06
  items:
    - "🎉 Congrats to Tingfeng and Yusen on **[ZenFlow](https://arxiv.org/abs/2505.12242)** accepted to [SIGMOD 2027](https://2027.sigmod.org/index.shtml)! ZenFlow enables stall-free offloaded LLM training and is integrated in DeepSpeed."

- date: 2026-04
  items:
    - "🎉 Congratulations to Tingfeng on receiving the **EuroSys’26 Distinguished AEC Award**!"
    - "🎓 Three Ph.D. students from [DS2](http://ds2-lab.github.io/) are graduating this semester. [Yuqi Fu](https://fishercht1995.github.io/) will be starting a faculty position in academia. [Zhaoyuan Su](https://alexsssu.github.io/) will be joining Snowflake AI Research. [Rui Yang](https://ruiyang00.github.io/) will be joining the ByteDance AI infra team. Congratulations to all three!"

- date: 2026-02
  items:
    - "We have released BitX, a high-performance, lossless compressor for safetensors model files ([paper](https://arxiv.org/abs/2505.06252), [Rust crate](https://crates.io/crates/bitx-codec)). BitX achieves 10+ GB/s compression throughput, making it practical for large-scale model storage and transfer. We've also open-sourced [ZipLLM](https://github.com/ds2-lab/ZipLLM), our model-aware data reduction pipeline. Access the [project website](https://ds2-lab.github.io/ZipLLM/) to learn more about the project. Check them out and share your feedback!"

- date: 2026-01
  items:
    - "🎉 Two papers accepted to [MLSys'26](https://mlsys.org/Conferences/2026). Congrats to Zhaoyuan and Rui!"

- date: 2025-12
  items:
    - "Thrilled to receive a [CCI award](https://cyberinitiative.org/proposals/2025-calls/critical-infrastructure-cybersecurity.html) (with Songqing Chen from GMU). Thanks, CCI!"

- date: 2025-08
  items:
    - "🚀 ZenFlow has now been officially adopted into [DeepSpeed](https://github.com/deepspeedai/DeepSpeed) and is also featured on the [PyTorch blog](https://pytorch.org/blog/zenflow-stall-free-offloading-engine-for-llm-training/)!"
    - "🎉 Congrats to Ruizhe and Yuqi on their paper accepted to [IMC 2025](https://conferences.sigcomm.org/imc/2025/)!"

- date: 2025-07
  items:
    - "🎓 [Ben Carver](https://scusemua.github.io/) successfully defended his Ph.D. dissertation. Congratulations, Dr. Carver!! Ben will be joining the AI Networking Infrastructure team @ Meta as a Research Scientist, where he'll work on cutting-edge infrastructure to support next-gen AI."
    - "🎉 Congrats to Zirui, Tingfeng, and Zhaoyuan on **ZipLLM** accepted to [NSDI 2026](https://www.usenix.org/conference/nsdi26)! We analyzed all publicly available LLM repos on Hugging Face and built effective, efficient data reduction algorithms tailored for massive-scale LLM storage. Stay tuned for more updates!"

- date: 2025-06
  items:
    - "🎉 Congrats to Ben and Jingyuan on **NotebookOS** accepted to [ASPLOS 2026](https://www.asplos-conference.org/asplos2026/)! In this work, we built a GPU-efficient distributed Notebook platform that enables on-demand GPU allocation for interactive training workloads such as LLM fine-tuning. Stay tuned for more updates on the project! Stay tuned for more info about the code release."

- date: 2025-01
  items:
    - "🎉 Congrats to Qichang on **CIDRE** accepted to [ASPLOS 2025](https://www.asplos-conference.org/asplos2025/)!"
    - "🎉 Congrats to Ruizhe on the IPFS data management work accepted to [WWW 2025](https://www2025.thewebconf.org/)!"

- date: 2024-09
