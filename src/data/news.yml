- date: 2024-03
  items:
    - "Congrats to Ruizhe on the IPFS analysis work accepted to [SIGMETRICS 2024](https://www.sigmetrics.org/sigmetrics2024/index.html)! We answered questions about accessibility, content, and performance of IPFS in this research."
    - "Congrats to Zhaoyuan, Ammar, and Zirui on [their work](https://arxiv.org/abs/2402.13429) accepted to [VLDB 2024](https://vldb.org/2024/)! In this work, Zhaoyuan analyzed a large dataset of real-world pre-trained ML models collected from Hugging Face. Based on the analysis study, he designed a new storage compression method for reducing the storage requirement of pre-trained models at scale."

- date: 2024-02
  items:
